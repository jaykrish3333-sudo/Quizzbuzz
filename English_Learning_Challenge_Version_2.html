<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Learning Challenge - Version 2</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#111827,#164e63,#312e81)}
.wrap{max-width:760px;margin:auto;padding:18px}.card{padding:24px;border-radius:22px;background:rgba(255,255,255,.11);backdrop-filter:blur(12px);box-shadow:0 15px 45px #0005}
h1,h2{text-align:center}.sub,.small{color:#dbeafe;text-align:center}input{width:100%;padding:14px;border:0;border-radius:12px;font-size:17px;margin:12px 0}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{width:100%;background:#4ade80;color:#052e16}.option{display:block;width:100%;margin:10px 0;text-align:left;background:#fff;color:#111}
.option.correct{background:#86efac}.option.wrong{background:#fca5a5}.top{display:flex;justify-content:space-between;gap:10px}
.badge{padding:9px 12px;border-radius:10px;background:#ffffff1f}.center{text-align:center}.progress{height:8px;background:#ffffff22;border-radius:8px;margin:14px 0 20px;overflow:hidden}
.progress i{display:block;height:100%;background:#4ade80;width:0}.timer{font-size:25px;text-align:center;font-weight:bold;margin:8px}.danger{color:#fca5a5}
.question{font-size:22px;line-height:1.45;margin:20px 0}.feedback{margin-top:14px;padding:14px;border-radius:12px;background:#ffffff16;line-height:1.55}
.next{width:100%;margin-top:14px;background:#facc15;color:#422006}.restart{width:100%;margin-top:12px;background:#38bdf8;color:#082f49}
.hidden{display:none}.score{font-size:44px;font-weight:bold}.trophy{font-size:85px;animation:b 1s infinite alternate}@keyframes b{to{transform:translateY(-10px) rotate(3deg)}}
</style></head>
<body><div class="wrap"><div class="card">
<section id="start"><h1>🇬🇧 English Learning Challenge</h1><p class="sub">VERSION 2 • New Question Bank</p>
<p>Enter your name:</p><input id="name" maxlength="40" placeholder="Your name">
<button class="primary" onclick="start()">Start Version 2 🚀</button>
<p class="small">Easy → Moderate → Hard | Tenses • Grammar • Spoken English</p></section>

<section id="quiz" class="hidden"><div class="top"><div class="badge" id="lv"></div><div class="badge" id="sc"></div></div>
<div class="badge center" id="qn"></div><div class="progress"><i id="bar"></i></div><div class="timer" id="tm"></div>
<div class="question" id="q"></div><div id="opts"></div><div id="fb" class="feedback hidden"></div>
<button id="next" class="next hidden" onclick="next()">Next ➜</button></section>

<section id="result" class="hidden center"><div class="trophy">🏆</div><h1 id="rt"></h1><div id="celebrate">🎉 ⭐ 🎉 ⭐ 🎉</div>
<p id="rtext"></p><div class="score" id="fs"></div><p id="pct"></p><div id="break"></div>
<button class="restart" onclick="location.reload()">Try Version 2 Again 🔄</button></section>
</div></div>
<script>
const levels={"EASY": [{"q": "My brother ___ a doctor.", "a": ["is", "are", "am", "be"], "c": 0, "t": "என் சகோதரர் ஒரு மருத்துவர்.", "e": "Use 'is' with he/she/it or a singular person."}, {"q": "We ___ to the park every Sunday.", "a": ["go", "goes", "went", "going"], "c": 0, "t": "நாங்கள் ஒவ்வொரு ஞாயிற்றுக்கிழமையும் பூங்காவிற்குச் செல்கிறோம்.", "e": "'We' takes the base verb in simple present: we go."}, {"q": "Look! The baby ___.", "a": ["sleep", "sleeps", "is sleeping", "slept"], "c": 2, "t": "பாருங்கள்! குழந்தை தூங்கிக் கொண்டிருக்கிறது.", "e": "'Look!' shows an action happening now, so use present continuous."}, {"q": "Yesterday, I ___ my friend.", "a": ["meet", "meets", "met", "meeting"], "c": 2, "t": "நேற்று நான் என் நண்பரை சந்தித்தேன்.", "e": "'Yesterday' needs the past form: met."}, {"q": "They ___ happy today.", "a": ["is", "are", "am", "be"], "c": 1, "t": "அவர்கள் இன்று மகிழ்ச்சியாக இருக்கிறார்கள்.", "e": "Use 'are' with 'they'."}, {"q": "He ___ coffee in the morning.", "a": ["drink", "drinks", "drank", "drinking"], "c": 1, "t": "அவன் காலையில் காபி குடிப்பான்.", "e": "A regular habit uses simple present; he + drinks."}, {"q": "Choose the correct sentence.", "a": ["I can to swim.", "I can swim.", "I can swimming.", "I can swam."], "c": 1, "t": "என்னால் நீந்த முடியும்.", "e": "After 'can', use the base verb: can swim."}, {"q": "What do you say when someone helps you?", "a": ["Sorry", "Thank you", "Good night", "Excuse me"], "c": 1, "t": "யாராவது உதவி செய்தால் 'Thank you' என்று சொல்வோம்.", "e": "'Thank you' is used to express thanks."}, {"q": "The book is ___ the table.", "a": ["on", "at", "to", "from"], "c": 0, "t": "புத்தகம் மேசையின் மேல் உள்ளது.", "e": "Use 'on' for something resting on a surface."}, {"q": "I ___ hungry now.", "a": ["am", "is", "are", "be"], "c": 0, "t": "எனக்கு இப்போது பசியாக இருக்கிறது.", "e": "Use 'am' with 'I'."}], "MODERATE": [{"q": "My father ___ already gone to work.", "a": ["has", "have", "is", "did"], "c": 0, "t": "என் தந்தை ஏற்கனவே வேலைக்குச் சென்றுவிட்டார்.", "e": "Use present perfect 'has gone' with a singular subject."}, {"q": "We ___ dinner when the phone rang.", "a": ["have", "had", "were having", "are having"], "c": 2, "t": "தொலைபேசி அடித்தபோது நாங்கள் இரவு உணவு சாப்பிட்டுக் கொண்டிருந்தோம்.", "e": "An action in progress in the past uses 'were having'."}, {"q": "She has worked here ___ three years.", "a": ["since", "for", "at", "from"], "c": 1, "t": "அவள் மூன்று ஆண்டுகளாக இங்கு வேலை செய்கிறாள்.", "e": "Use 'for' with a period of time."}, {"q": "I ___ my keys, so I cannot open the door.", "a": ["lose", "lost", "have lost", "losing"], "c": 2, "t": "என் சாவிகளை தொலைத்துவிட்டேன், அதனால் கதவைத் திறக்க முடியவில்லை.", "e": "The present result comes from a past action, so use present perfect."}, {"q": "He will call you when he ___.", "a": ["arrives", "will arrive", "arrived", "arriving"], "c": 0, "t": "அவன் வந்ததும் உங்களை அழைப்பான்.", "e": "After 'when' for a future event, use simple present."}, {"q": "Which sentence is correct?", "a": ["She can speaks English.", "She can speak English.", "She can speaking English.", "She can spoke English."], "c": 1, "t": "அவளால் ஆங்கிலம் பேச முடியும்.", "e": "Modal 'can' is followed by the base verb."}, {"q": "I am interested ___ learning English.", "a": ["on", "at", "in", "for"], "c": 2, "t": "ஆங்கிலம் கற்றுக்கொள்வதில் எனக்கு ஆர்வம் உள்ளது.", "e": "The expression is 'interested in'."}, {"q": "You ___ wear a helmet while riding a bike.", "a": ["should", "would", "could be", "are"], "c": 0, "t": "பைக் ஓட்டும்போது நீங்கள் ஹெல்மெட் அணிய வேண்டும்.", "e": "'Should' gives advice or a recommendation."}, {"q": "What is the natural way to offer help?", "a": ["Do you need any help?", "You help?", "Need help you?", "Are you help?"], "c": 0, "t": "உங்களுக்கு ஏதாவது உதவி வேண்டுமா?", "e": "'Do you need any help?' is a natural offer of help."}, {"q": "There ___ some milk in the fridge.", "a": ["are", "is", "were", "be"], "c": 1, "t": "ஃப்ரிட்ஜில் கொஞ்சம் பால் உள்ளது.", "e": "'Milk' is uncountable, so use 'is'."}, {"q": "She ___ English for two hours before lunch.", "a": ["studied", "has studied", "had been studying", "is studying"], "c": 2, "t": "மதிய உணவுக்கு முன் அவள் இரண்டு மணி நேரமாக ஆங்கிலம் படித்துக் கொண்டிருந்தாள்.", "e": "Past perfect continuous shows an ongoing action before another past event."}, {"q": "I would like ___ a cup of tea.", "a": ["have", "to have", "having", "had"], "c": 1, "t": "எனக்கு ஒரு கப் தேநீர் வேண்டும்.", "e": "'Would like' is followed by 'to + verb'."}, {"q": "The opposite of 'cheap' is ___.", "a": ["small", "expensive", "easy", "slow"], "c": 1, "t": "'Cheap' என்பதன் எதிர்ச்சொல் 'expensive'.", "e": "Cheap means low in price; expensive means high in price."}, {"q": "Could you tell me ___ the station is?", "a": ["where", "what", "who", "when"], "c": 0, "t": "நிலையம் எங்கே இருக்கிறது என்று சொல்ல முடியுமா?", "e": "Use 'where' when asking about a place."}, {"q": "I haven't finished my work ___.", "a": ["already", "yet", "ever", "just"], "c": 1, "t": "நான் இன்னும் என் வேலையை முடிக்கவில்லை.", "e": "'Yet' is commonly used in negative sentences about something expected."}], "HARD": [{"q": "By next month, she ___ here for ten years.", "a": ["works", "will work", "will have worked", "worked"], "c": 2, "t": "அடுத்த மாதத்திற்குள் அவள் இங்கு பத்து ஆண்டுகள் வேலை செய்திருப்பாள்.", "e": "Future perfect shows something completed by a future time."}, {"q": "If I were you, I ___ this opportunity.", "a": ["take", "will take", "would take", "took"], "c": 2, "t": "நான் உங்கள் நிலையில் இருந்தால், இந்த வாய்ப்பை பயன்படுத்துவேன்.", "e": "Second conditional uses 'If I were..., I would...'."}, {"q": "He said that he ___ busy that day.", "a": ["is", "was", "will be", "has"], "c": 1, "t": "அன்று தான் பிஸியாக இருப்பதாக அவன் கூறினான்.", "e": "Reported speech commonly changes present 'is' to past 'was'."}, {"q": "The documents must ___ before Friday.", "a": ["submit", "be submitted", "submitted", "submitting"], "c": 1, "t": "ஆவணங்கள் வெள்ளிக்கிழமைக்கு முன் சமர்ப்பிக்கப்பட வேண்டும்.", "e": "After 'must' in passive voice: must be + past participle."}, {"q": "I used to ___ cricket when I was young.", "a": ["play", "playing", "played", "plays"], "c": 0, "t": "நான் சிறுவனாக இருந்தபோது கிரிக்கெட் விளையாடுவேன்.", "e": "'Used to' is followed by the base verb."}, {"q": "Not only ___ late, but he also forgot the documents.", "a": ["he arrived", "did he arrive", "he did arrive", "arrived he"], "c": 1, "t": "அவன் தாமதமாக வந்ததோடு மட்டுமல்லாமல், ஆவணங்களையும் மறந்துவிட்டான்.", "e": "After 'Not only' at the beginning, formal English uses inversion: did he arrive."}, {"q": "She suggested ___ the meeting to Monday.", "a": ["move", "to move", "moving", "moved"], "c": 2, "t": "கூட்டத்தை திங்கட்கிழமைக்கு மாற்றுமாறு அவள் பரிந்துரைத்தாள்.", "e": "'Suggest' is commonly followed by verb-ing."}, {"q": "I wish I ___ more confident when speaking English.", "a": ["am", "were", "will be", "have"], "c": 1, "t": "ஆங்கிலம் பேசும்போது நான் இன்னும் நம்பிக்கையுடன் இருந்தால் நன்றாக இருக்கும்.", "e": "'I wish I were...' expresses a present unreal wish."}, {"q": "The man ___ lives next door is a teacher.", "a": ["which", "who", "where", "whose"], "c": 1, "t": "அடுத்த வீட்டில் வசிக்கும் அந்த மனிதர் ஒரு ஆசிரியர்.", "e": "Use 'who' for a person in a relative clause."}, {"q": "You had better ___ now.", "a": ["leave", "to leave", "leaving", "left"], "c": 0, "t": "நீங்கள் இப்போது செல்வது நல்லது.", "e": "'Had better' is followed by the base verb."}, {"q": "Hardly had I arrived when it ___.", "a": ["rains", "rained", "was raining", "has rained"], "c": 1, "t": "நான் வந்தவுடனே மழை பெய்தது.", "e": "With 'Hardly had...', the following past event is usually simple past."}, {"q": "She is used to ___ early.", "a": ["wake", "waking", "woke", "wakes"], "c": 1, "t": "அவள் சீக்கிரம் எழுவதற்குப் பழகியிருக்கிறாள்.", "e": "'Be used to' is followed by a noun or verb-ing."}, {"q": "If they had left earlier, they ___ the bus.", "a": ["catch", "would catch", "would have caught", "caught"], "c": 2, "t": "அவர்கள் முன்பே சென்றிருந்தால், பேருந்தை பிடித்திருப்பார்கள்.", "e": "Third conditional uses 'would have + past participle'."}, {"q": "Would you mind ___ the window?", "a": ["open", "to open", "opening", "opened"], "c": 2, "t": "ஜன்னலைத் திறக்க உங்களுக்கு ஆட்சேபனை இருக்கிறதா?", "e": "'Would you mind' is followed by verb-ing."}, {"q": "The meeting was cancelled ___ the manager was ill.", "a": ["because", "although", "unless", "despite"], "c": 0, "t": "மேலாளர் உடல்நிலை சரியில்லாததால் கூட்டம் ரத்து செய்யப்பட்டது.", "e": "'Because' introduces the reason for something."}]};
const info=[["EASY",10,7],["MODERATE",13,12],["HARD",15,0]];
let L=0,i=0,s=0,ls=[0,0,0],name="",left=10,timer=null,done=false;
function start(){name=document.getElementById("name").value.trim();if(!name)return alert("Please enter your name.");
document.getElementById("start").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");load();}
function load(){clearInterval(timer);done=false;let key=info[L][0],q=levels[key][i];left=info[L][1];
document.getElementById("lv").textContent=key+" LEVEL";document.getElementById("sc").textContent="Score: "+s;
document.getElementById("qn").textContent=`Question ${i+1} of ${levels[key].length}`;document.getElementById("bar").style.width=(i/levels[key].length*100)+"%";
document.getElementById("tm").textContent=left+"s";document.getElementById("tm").classList.remove("danger");document.getElementById("q").textContent=q.q;
let o=document.getElementById("opts");o.innerHTML="";q.a.forEach((x,n)=>{let b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>answer(n);o.appendChild(b);});
document.getElementById("fb").classList.add("hidden");document.getElementById("next").classList.add("hidden");
timer=setInterval(()=>{left--;document.getElementById("tm").textContent=left+"s";if(left<=3)document.getElementById("tm").classList.add("danger");if(left<=0){clearInterval(timer);answer(-1);}},1000);}
function answer(n){if(done)return;done=true;clearInterval(timer);let q=levels[info[L][0]][i];
document.querySelectorAll(".option").forEach((b,k)=>{if(k===q.c)b.classList.add("correct");if(k===n&&n!==q.c)b.classList.add("wrong");});
let f=document.getElementById("fb");if(n===q.c){s++;f.innerHTML="✅ <b>Correct!</b>";}else if(n===-1)f.innerHTML="⏰ <b>Time's up!</b>";else f.innerHTML="❌ <b>Not quite.</b>";
f.innerHTML+=`<div><b>Correct answer:</b> ${q.a[q.c]}<br><b>Tamil:</b> ${q.t}<br><b>Simple English:</b> ${q.e}</div>`;f.classList.remove("hidden");
document.getElementById("sc").textContent="Score: "+s;document.getElementById("next").classList.remove("hidden");
document.getElementById("next").textContent=i===levels[info[L][0]].length-1?"Finish Level ➜":"Next Question ➜";}
function next(){i++;let key=info[L][0];if(i<levels[key].length)return load();ls[L]=s;
if(L<2){if(s<info[L][2])return fail();L++;i=0;s=0;load();}else final();}
function fail(){document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");
document.querySelector(".trophy").textContent="📖";document.getElementById("celebrate").textContent="💪 Keep Practising!";
document.getElementById("rt").textContent="Keep Going, "+name+"!";document.getElementById("rtext").innerHTML=`You scored <b>${s}/${info[L][0]==="EASY"?10:15}</b> in ${info[L][0]}.<br>Need <b>${info[L][2]}</b> to unlock the next level.`;
document.getElementById("fs").textContent=s;document.getElementById("pct").textContent="Review the explanations and try again.";}
function final(){document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");
let total=ls[0]+ls[1]+ls[2],pct=(total/40*100).toFixed(1);document.getElementById("rt").textContent=`Congratulations, ${name}! 🎉`;
document.getElementById("rtext").textContent="You completed all three levels in Version 2!";
document.getElementById("fs").textContent=total+" / 40";document.getElementById("pct").textContent="Overall Percentage: "+pct+"%";
document.getElementById("break").innerHTML=`<p>🟢 Easy: ${ls[0]}/10</p><p>🟡 Moderate: ${ls[1]}/15</p><p>🔴 Hard: ${ls[2]}/15</p>`;}
</script></body></html>
